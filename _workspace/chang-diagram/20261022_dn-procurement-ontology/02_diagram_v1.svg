<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" font-family="Pretendard, 'Malgun Gothic', sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#1B2A4A"/>
    </marker>
  </defs>
  <rect width="1600" height="900" fill="#FFFFFF"/>
  <g data-role="title">
    <text x="64" y="112" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="42" font-weight="700" fill="#1B2A4A">위험 성향만 바꿔도 구매 배분이 달라진다</text>
    <text x="64" y="152" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="22" font-weight="400" fill="#2C3E5A">DN솔루션즈 구매부서 · 문제 정의 → 온톨로지 → 최적화 → What-if → 사람의 결정</text>
  </g>
  <g data-group="problem" data-container="true">
    <rect data-box="true" x="64" y="184" width="288" height="456" fill="#F5F5F7"/>
    <text x="88" y="224" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="22" font-weight="700" fill="#1B2A4A">문제 정의</text>
  </g>
  <g data-group="solution" data-container="true">
    <rect data-box="true" x="384" y="184" width="1152" height="456" fill="#F5F5F7"/>
    <text x="408" y="224" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="22" font-weight="700" fill="#1B2A4A">솔루션</text>
  </g>
  <g data-node="q">
    <rect data-box="true" x="88" y="256" width="240" height="200" rx="8" fill="#FFFFFF" stroke="#7F8FA9" stroke-width="1.5"/>
    <text x="104" y="300" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="20" font-weight="700" fill="#1B2A4A">무엇을 얼마나 살까</text>
    <text font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="17" font-weight="400" fill="#2C3E5A"><tspan x="104" y="344">3품목 × 공급사 4곳</tspan><tspan x="104" y="372">목표 비용·리스크·납기</tspan><tspan x="104" y="400">2027 Q1 · 구매본부장 결정</tspan></text>
  </g>
  <g data-node="onto">
    <rect data-box="true" x="408" y="256" width="240" height="200" rx="8" fill="#FFFFFF" stroke="#7F8FA9" stroke-width="1.5"/>
    <text x="424" y="300" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="20" font-weight="700" fill="#1B2A4A">온톨로지</text>
    <text font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="17" font-weight="400" fill="#2C3E5A"><tspan x="424" y="344">객체 9 · 관계 8 · 액션 5</tspan><tspan x="424" y="372">제약 6: MOQ·납기·최대비중</tspan><tspan x="424" y="400">What-if·결정도 객체로</tspan></text>
  </g>
  <g data-node="opt">
    <rect data-box="true" x="696" y="256" width="240" height="200" rx="8" fill="#FFF4E8" stroke="#B45309" stroke-width="3"/>
    <text x="712" y="300" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="20" font-weight="700" fill="#1B2A4A">위험 성향별 대안</text>
    <text font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="17" font-weight="400" fill="#2C3E5A"><tspan x="712" y="344">A 비용최소 87.1억</tspan><tspan x="712" y="372">B 리스크균형 88.9억</tspan><tspan x="712" y="400">C 공급안정 94.7억</tspan></text>
  </g>
  <g data-node="whatif">
    <rect data-box="true" x="984" y="256" width="240" height="200" rx="8" fill="#FFFFFF" stroke="#7F8FA9" stroke-width="1.5"/>
    <text x="1000" y="300" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="20" font-weight="700" fill="#1B2A4A">What-if (B안 기준)</text>
    <text font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="17" font-weight="400" fill="#2C3E5A"><tspan x="1000" y="344">W1 중국 중단 +7.2억</tspan><tspan x="1000" y="372">W3 엔화 +15% 변화 없음</tspan><tspan x="1000" y="400">W4 납기 30일 해 없음</tspan></text>
  </g>
  <g data-node="decide">
    <rect data-box="true" x="1272" y="256" width="240" height="200" rx="8" fill="#FFFFFF" stroke="#7F8FA9" stroke-width="1.5"/>
    <text x="1288" y="300" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="20" font-weight="700" fill="#1B2A4A">사람이 결정·기록</text>
    <text font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="17" font-weight="400" fill="#2C3E5A"><tspan x="1288" y="344">예) 본부장 B안 선택</tspan><tspan x="1288" y="372">C안 대비 5.8억 절감</tspan><tspan x="1288" y="400">기각안·재검토 조건 기록</tspan></text>
  </g>
  <g data-edge="q->onto">
    <path d="M328 356 H406" fill="none" stroke="#1B2A4A" stroke-width="3" marker-end="url(#arrow)"/>
  </g>
  <g data-edge="onto->opt">
    <path d="M648 356 H694" fill="none" stroke="#1B2A4A" stroke-width="3" marker-end="url(#arrow)"/>
  </g>
  <g data-edge="opt->whatif">
    <path d="M936 356 H982" fill="none" stroke="#1B2A4A" stroke-width="3" marker-end="url(#arrow)"/>
  </g>
  <g data-edge="whatif->decide">
    <path d="M1224 356 H1270" fill="none" stroke="#1B2A4A" stroke-width="3" marker-end="url(#arrow)"/>
  </g>
  <g data-annotation="q_note">
    <rect x="88" y="488" width="3" height="76" fill="#7F8FA9"/>
    <text font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="16" font-weight="400" fill="#2C3E5A"><tspan x="104" y="512">주물 베드 1,000세트</tspan><tspan x="104" y="536">볼스크류 3,200개</tspan><tspan x="104" y="560">LM가이드 4,000개</tspan></text>
  </g>
  <g data-annotation="opt_note">
    <rect x="696" y="488" width="3" height="52" fill="#7F8FA9"/>
    <text font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="16" font-weight="400" fill="#2C3E5A"><tspan x="712" y="512">λ 0 → 0.3 → 1.0</tspan><tspan x="712" y="536">중국 비중 48% → 37% → 16%</tspan></text>
  </g>
  <g data-annotation="w4_note">
    <rect x="984" y="488" width="3" height="52" fill="#7F8FA9"/>
    <text font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="16" font-weight="400" fill="#2C3E5A"><tspan x="1000" y="512">해 없음(W4)이 가장 값진 결과</tspan><tspan x="1000" y="536">약속 납기 불가를 사전에 드러냄</tspan></text>
  </g>
  <g data-annotation="human_note">
    <rect x="1272" y="488" width="3" height="52" fill="#7F8FA9"/>
    <text font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="16" font-weight="400" fill="#2C3E5A"><tspan x="1288" y="512">AI는 고르지 않는다</tspan><tspan x="1288" y="536">중단 확률 판단은 사람의 몫</tspan></text>
  </g>
  <g data-annotation="src">
    <text x="64" y="688" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="14" font-weight="400" fill="#2C3E5A">단가·공급사·수량은 가상 데이터 기준 · 회사 배경만 공개 자료 참고</text>
  </g>
  <g data-role="takeaway">
    <rect data-box="true" x="64" y="720" width="1472" height="112" fill="#1B2A4A"/>
    <text x="800" y="784" text-anchor="middle" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="22" font-weight="700" fill="#FFFFFF">λ는 경영진의 위험 선호 — 누가 정할지 거버넌스로 정한다</text>
  </g>
</svg>
