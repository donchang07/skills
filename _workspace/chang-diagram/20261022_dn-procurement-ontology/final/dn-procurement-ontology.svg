<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" font-family="Pretendard, 'Malgun Gothic', sans-serif">
<defs><marker id="arrow" viewBox="0 0 12 12" refX="12" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 L12 6 L0 12 Z" fill="#1B2A4A"/></marker></defs>
<rect width="1600" height="900" fill="#FFFFFF"/>
<g data-role="title"><text x="64" y="112" font-size="42" font-weight="700" fill="#1B2A4A">위험 성향만 바꿔도 구매 배분이 달라진다</text><text x="64" y="152" font-size="22" fill="#2C3E5A">DN솔루션즈 구매부서 · 문제 정의 → 온톨로지 → 최적화 → What-if → 사람의 결정</text></g>
<g data-group="problem" data-container="true"><rect data-box="true" x="64" y="248" width="280" height="348" fill="#F5F5F7"/><text x="80" y="284" font-size="22" font-weight="700" fill="#1B2A4A">문제 정의</text></g>
<g data-group="solution" data-container="true"><rect data-box="true" x="362" y="248" width="1174" height="348" fill="#F5F5F7"/><text x="378" y="284" font-size="22" font-weight="700" fill="#1B2A4A">솔루션</text></g>
<g data-node="q"><rect data-box="true" x="80" y="304" width="248" height="168" rx="8" fill="#FFFFFF" stroke="#7F8FA9" stroke-width="1.5"/><text x="96" y="340" font-size="20" font-weight="700" fill="#1B2A4A">무엇을 얼마나 살까</text><text font-size="17" fill="#2C3E5A"><tspan x="96" y="380">3품목 × 공급사 4곳</tspan><tspan x="96" y="408">목표 비용·리스크·납기</tspan><tspan x="96" y="436">2027 Q1 · 구매본부장 결정</tspan></text></g>
<g data-node="onto"><rect data-box="true" x="378" y="304" width="248" height="168" rx="8" fill="#FFFFFF" stroke="#7F8FA9" stroke-width="1.5"/><text x="394" y="340" font-size="20" font-weight="700" fill="#1B2A4A">온톨로지</text><text font-size="17" fill="#2C3E5A"><tspan x="394" y="380">객체 9 · 관계 8 · 액션 5</tspan><tspan x="394" y="408">제약 6개</tspan><tspan x="394" y="436">What-if·결정도 객체로</tspan></text></g>
<g data-node="opt"><rect data-box="true" x="676" y="304" width="248" height="168" rx="8" fill="#FFF4E8" stroke="#B45309" stroke-width="3"/><text x="692" y="340" font-size="20" font-weight="700" fill="#1B2A4A">위험 성향별 대안</text><text font-size="17" fill="#2C3E5A"><tspan x="692" y="380">A 비용최소 87.1억</tspan><tspan x="692" y="408">B 리스크균형 88.9억</tspan><tspan x="692" y="436">C 공급안정 94.7억</tspan></text></g>
<g data-node="whatif"><rect data-box="true" x="974" y="304" width="248" height="168" rx="8" fill="#FFFFFF" stroke="#7F8FA9" stroke-width="1.5"/><text x="990" y="340" font-size="20" font-weight="700" fill="#1B2A4A">What-if (B안 기준)</text><text font-size="17" fill="#2C3E5A"><tspan x="990" y="380">중국 중단 +7.2억</tspan><tspan x="990" y="408">엔화 +15% 변화 없음</tspan><tspan x="990" y="436">볼스크류 납기 30일: 불가</tspan></text></g>
<g data-node="decide"><rect data-box="true" x="1272" y="304" width="248" height="168" rx="8" fill="#FFFFFF" stroke="#7F8FA9" stroke-width="1.5"/><text x="1288" y="340" font-size="20" font-weight="700" fill="#1B2A4A">사람이 결정·기록</text><text font-size="17" fill="#2C3E5A"><tspan x="1288" y="380">예: 본부장이 B안 택하면</tspan><tspan x="1288" y="408">C안 대비 5.8억 절감</tspan><tspan x="1288" y="436">기각안·재검토 조건 기록</tspan></text></g>
