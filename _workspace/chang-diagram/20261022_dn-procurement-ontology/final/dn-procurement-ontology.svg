<g data-annotation="onto_note"><rect x="378" y="496" width="3" height="52" fill="#7F8FA9"/><text font-size="16" fill="#2C3E5A"><tspan x="394" y="520">순소요·공급능력·MOQ</tspan><tspan x="394" y="544">납기·최대비중·최소약정</tspan></text></g>
<g data-annotation="opt_note"><rect x="676" y="496" width="3" height="76" fill="#7F8FA9"/><text font-size="16" fill="#2C3E5A"><tspan x="692" y="520">위험 성향 λ 0→0.3→1.0</tspan><tspan x="692" y="544">+ 최대비중 100→60→40%</tspan><tspan x="692" y="568">→ 중국 비중 48→37→16%</tspan></text></g>
<g data-annotation="w4_note"><rect x="974" y="496" width="3" height="76" fill="#7F8FA9"/><text font-size="16" fill="#2C3E5A"><tspan x="990" y="520">조달 불가: 맞는 구매안 없음</tspan><tspan x="990" y="544">이 결과가 가장 값지다</tspan><tspan x="990" y="568">못 지킬 납기를 미리 드러냄</tspan></text></g>
<g data-annotation="human_note"><rect x="1272" y="496" width="3" height="52" fill="#7F8FA9"/><text font-size="16" fill="#2C3E5A"><tspan x="1288" y="520">AI는 고르지 않는다</tspan><tspan x="1288" y="544">중단 확률 판단은 사람의 몫</tspan></text></g>
<g data-annotation="src"><text x="64" y="656" font-size="14" fill="#2C3E5A">단가·공급사·수량은 가상 데이터 기준 · 회사 배경만 공개 자료 참고</text></g>
<g data-role="takeaway"><rect data-box="true" x="64" y="676" width="1472" height="80" fill="#F5F5F7"/><rect x="64" y="676" width="8" height="80" fill="#1B2A4A"/><text x="800" y="724" text-anchor="middle" font-size="22" font-weight="700" fill="#1B2A4A">λ는 경영진의 위험 선호 — 누가 정할지 거버넌스로 정한다</text></g>
